<!DOCTYPE html>
<!--
  lang="en-IN" matches the product's actual locale and every
  toLocaleDateString('en-IN') call in the app.

  ⚠️ KNOWN LIMITATION it does NOT fix. UI_ATLAS §5.4 forbids MM/DD anywhere
  (a real hazard when staff read 03/04 as 3 April) and requires 24-hour
  times. All text the app renders itself obeys that — see
  components/clinic/format.js. But native <input type="date"|"time"> take
  their display format from the BROWSER'S UI LANGUAGE, not from this
  attribute, not from the JS locale and not from CSS; verified in Chrome,
  where an en-IN page in an en-US browser still shows mm/dd/yyyy and
  05:00 PM. Fixing it properly means replacing the native pickers with
  custom controls, which costs the native mobile keyboard and picker
  accessibility. Left as-is deliberately, and worth a decision before
  clinical sign-off.
-->
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <!-- ⚠️ `viewport-fit=cover` is what makes `env(safe-area-inset-*)` resolve to
         anything other than 0. Without it the CSS below is inert and fixed
         bottom bars sit under the iPhone home indicator. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="SHRI HEALTH — your records, medicines, appointments and care team in one secure portal." />
    <meta name="theme-color" content="#E8EDF4" />
    <title>SHRI HEALTH</title>
    <meta property="og:title" content="SHRI HEALTH" />
    <meta property="og:description" content="SHRI HEALTH — your records, medicines, appointments and care team in one secure portal." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <!--
      Pre-paint theme application. This has to be a blocking, non-module script
      in <head>: a module script is deferred, so React would mount and paint the
      light theme first and the page would visibly flash before switching.
      Kept deliberately in sync with app/ThemeContext.tsx (same storage key,
      same resolution rule, same ground colours).
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('strokeai-theme')
          if (stored !== 'light' && stored !== 'dark' && stored !== 'system') stored = 'system'
          var isDark =
            stored === 'dark' ||
            (stored === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (isDark) document.documentElement.classList.add('dark')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', isDark ? '#14181F' : '#E8EDF4')
        } catch (e) {
          /* Blocked storage — light theme is the correct fallback. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
