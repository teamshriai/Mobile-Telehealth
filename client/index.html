<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Stroke AI — Emergency Stroke Response Platform" />
    <meta name="theme-color" content="#E8EDF4" />
    <title>Stroke AI — Emergency Stroke Response Platform</title>
    <meta property="og:title" content="Stroke AI" />
    <meta property="og:description" content="Stroke AI — Emergency Stroke Response Platform" />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="icon" type="image/png" href="/fevicon.png" />
    <!--
      Pre-paint theme application. This has to be a blocking, non-module script
      in <head>: a module script is deferred, so React would mount and paint the
      light theme first and the page would visibly flash before switching.
      Kept deliberately in sync with app/ThemeContext.jsx (same storage key,
      same resolution rule, same ground colours).
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('strokeai-theme')
          if (stored !== 'light' && stored !== 'dark' && stored !== 'system') stored = 'system'
          var isDark =
            stored === 'dark' ||
            (stored === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (isDark) document.documentElement.classList.add('dark')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', isDark ? '#14181F' : '#E8EDF4')
        } catch (e) {
          /* Blocked storage — light theme is the correct fallback. */
        }
      })()
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>

</html>
